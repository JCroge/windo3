# 系统配置
exchanges:
  - binance
  - okx

# 交易对（V2 Agent筛选 - 2026-05-06）
symbols:
  - WIF/USDT    # Tier1 #1: 得分46.93, 波动45%, 价差0.26%
  - TON/USDT    # Tier1 #2: 得分46.78, 波动25%, 价差0.14%
  - DOGE/USDT   # Tier1 #3: 得分45.95, 波动5%, 价差0.01%
  - MEGA/USDT   # Tier1 #4: 得分45.58, 波动7%, 价差0.11%
  - DASH/USDT   # Tier1 #5: 得分44.88, 波动23%, 价差0.09%

# 套利参数
arbitrage:
  min_profit_rate: 0.003  # 最小利润率0.3%（扣除手续费后）
  check_interval: 1  # 检查间隔（秒）

# 风控
risk:
  max_trade_amount: 500  # 单次最大交易额（USDT）
  max_drawdown: 0.20  # 最大回撤20%
  max_daily_loss: 300  # 每日最大亏损（USDT）

# 手续费（Maker/Taker）
fees:
  binance: 0.001
  okx: 0.001
