# 系统配置
exchanges:
  - binance
  - okx

# 交易对（V2 Agent筛选 - 2026-05-06）
symbols:
  - WIF/USDT    # Tier1 #1: 得分46.93, 波动45%, 价差0.26%
  - TON/USDT    # Tier1 #2: 得分46.78, 波动25%, 价差0.14%
  - DOGE/USDT   # Tier1 #3: 得分45.95, 波动5%, 价差0.01%
  - MEGA/USDT   # Tier1 #4: 得分45.58, 波动7%, 价差0.11%
  - DASH/USDT   # Tier1 #5: 得分44.88, 波动23%, 价差0.09%

# 套利参数
arbitrage:
  min_profit_rate: 0.003  # 最小利润率0.3%（扣除手续费后）
  check_interval: 1  # 检查间隔（秒）

# 风控
risk:
  max_trade_amount: 500  # 单次最大交易额（USDT）
  max_drawdown: 0.20  # 最大回撤20%
  max_daily_loss: 300  # 每日最大亏损（USDT）
  consecutive_loss_limit: 5  # 连续亏损熔断次数（连亏达此数即全平熔断）
  ev_winrate_gate_enabled: false  # 关闭后开仓门不用实际胜率(胜率25%不拦)，EV门仍按R:R/成本
  ev_neutral_p_win: 0.55          # 关闭胜率门时 EV 公式使用的固定中性胜率
  # 体制感知多单位置门（regime-aware-long-entry-guard）
  long_live_regime_aware_range_enabled: true   # 总开关；false=所有体制用默认0.82/0.75（回退旧行为）
  long_live_max_range_pos_choppy: 0.63         # 缓进中间步（0.70→0.63，朝目标0.55）；2026-06-23 两臂实证拦最热档(HYPE/SUI rp≈0.66-0.70)，差异带样本攒够再收到0.55；见 memory regime-threshold-070-vs-055-comparison
  long_live_daily_gain_range_pos_choppy: 0.50  # 同上体制下 daily_gain 二级门 range_pos
  # 反转合流否决（restore-llm-rsi-veto-power）：LLM看反 AND RSI背离反向 → 转等回调
  llm_rsi_reversal_veto_enabled: true   # 总开关；false=回退旧行为(LLM/RSI仅缩仓)。上线default待event_backtest定
  reversal_veto_min_llm_confidence: 0   # LLM反向需达此置信才计入合流(0=不启用该子门)

# 手续费（Maker/Taker）
fees:
  binance: 0.001
  okx: 0.001
